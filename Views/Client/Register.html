<div class="auth-box">
    <h2>Створити акаунт</h2>
    <form id="registerForm" class="auth-form">
        <div class="input-group">
            <label for="fullname">Ім'я та Прізвище</label>
            <input type="text" id="fullname" placeholder="Напр. Владислав Прус" required>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Введіть ваш email" required>
        </div>
        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Створіть пароль" required>
        </div>
        
        <button type="submit" class="btn-primary auth-btn">Зареєструватися</button>
    </form>
    
    <div class="auth-footer">
        <p>Вже є акаунт? <a href="Login.html">Увійти</a></p>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Зупиняємо перезавантаження сторінки
        
        // Імітація успішної реєстрації
        alert('Реєстрація успішна! Вітаємо в CinemaHub.');
        window.location.href = 'Index.html'; // Перекидаємо на афішу
    });
</script>
</body>
</html>
